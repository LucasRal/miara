[project]
name = "miara-backend"
version = "0.1.0"
description = "Miara - monolithe modulaire FastAPI (auth / hr / sales / core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "litellm",
    "celery",
    "redis",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "structlog",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = pyflakes+pycodestyle, I = isort, UP = pyupgrade, B = bugbear.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migrations générées par alembic : lignes longues tolérées.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI idiom puts Depends()/Query() in argument defaults on purpose.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true

# mypy strict sur core/ uniquement (exigence carte INFRA-1).
[[tool.mypy.overrides]]
module = "app.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Une seule boucle pour toute la session : les moteurs asyncpg partagés
# (app.core.db) ne survivent pas à un changement de boucle entre tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
