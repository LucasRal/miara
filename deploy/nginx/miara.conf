# vhost de PRODUCTION Miara : TLS, /api/ -> backend 8010, / -> frontend 3010.
#
# `__DOMAIN__` est remplacé par scripts/setup_vps.sh au moment de l'installation
# dans /etc/nginx/sites-available/miara.conf.
#
# Rappel des ports du projet (CLAUDE.md) : backend 8010, frontend 3010, EN DEV
# COMME EN PROD. Les deux n'écoutent que sur la loopback ; nginx est le seul
# processus exposé. La carte Trello mentionnait 8000/3000 : écart assumé.

# Amonts nommés : un seul endroit à changer si un port bouge un jour.
upstream miara_api {
    server 127.0.0.1:8010;
    keepalive 16;
}

upstream miara_web {
    server 127.0.0.1:3010;
    keepalive 16;
}

# HTTP : uniquement le challenge ACME et la redirection vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # --- TLS (certificats gérés par certbot, renouvellement automatique) ----
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/__DOMAIN__/chain.pem;
    # Paramètres écrits en clair plutôt qu'`include options-ssl-nginx.conf` :
    # ce fichier n'existe que si le plugin nginx de certbot est installé, et on
    # veut un vhost qui se relise sans dépendance cachée.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:MiaraTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # Pas d'`ssl_stapling` : Let's Encrypt a retiré l'URL du répondeur OCSP de
    # ses certificats (fin du service en 2025). La directive n'aurait rien à
    # agrafer et nginx ne ferait qu'écrire un avertissement à chaque démarrage.

    # --- En-têtes de sécurité ----------------------------------------------
    # `always` : sinon nginx ne les pose pas sur les réponses d'erreur.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP laissée commentée : Next.js injecte des scripts/styles inline et une
    # CSP stricte casse l'hydratation tant qu'on n'a pas mis en place les
    # nonces côté application. À activer dans un second temps, pas à l'aveugle.
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;

    # Ne pas annoncer la version de nginx dans les réponses et les pages d'erreur.
    server_tokens off;

    # --- Dépôt de CV --------------------------------------------------------
    # 200 Mo : borne applicative de 20 fichiers x 10 Mo (HR_MAX_UPLOAD_FILES x
    # HR_MAX_FILE_MB). nginx doit refuser AVANT que l'API ne lise le corps.
    client_max_body_size 200m;
    client_body_timeout 120s;

    # Toute la compression se fait ICI : le serveur Next tourne avec
    # `compress: false` (frontend/next.config.ts) parce qu'il gzippait aussi le
    # flux SSE de l'agent, ce qui retardait la trace jusqu'à la fin du tour.
    # `gzip_proxied any` est donc indispensable : les réponses de Next et de
    # l'API arrivent ici non compressées.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    access_log /var/log/nginx/miara.access.log;
    error_log  /var/log/nginx/miara.error.log;

    # --- Flux SSE (agent commercial) ---------------------------------------
    # Les tours d'agent émettent des évènements `step` pendant plusieurs
    # dizaines de secondes. Sans buffering off + timeouts longs, nginx
    # accumulerait les évènements et couperait la connexion à 60 s.
    location ~ ^/api/v1/.+/stream$ {
        proxy_pass http://miara_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # text/event-stream n'est pas dans gzip_types, mais on le coupe
        # explicitement : une compression ici remettrait la trace en tampon.
        gzip off;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- API FastAPI --------------------------------------------------------
    # Le préfixe /api est conservé : l'application monte ses routers sous
    # /api/v1 (app/main.py). Pas de rewrite, donc pas de piège d'URL.
    location /api/ {
        proxy_pass http://miara_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les réponses JSON sont petites : la mise en tampon n'apporte rien et
        # masquerait un flux oublié ici. On laisse passer au fil de l'eau.
        proxy_buffering off;
        # Un scoring synchrone ou un aller-retour Salesforce peut dépasser 60 s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Sonde de vivacité non versionnée, utile aux supervisions externes.
    location = /health {
        proxy_pass http://miara_api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Le navigateur ne doit jamais voir la doc OpenAPI en production.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Frontend Next.js ---------------------------------------------------
    location / {
        proxy_pass http://miara_web;
        proxy_http_version 1.1;
        # Upgrade/Connection : Next s'en sert pour ses websockets internes.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
