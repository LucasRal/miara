# vhost de BOOTSTRAP, en HTTP seul.
#
# Raison d'être : miara.conf référence /etc/letsencrypt/live/<domaine>/, qui
# n'existe pas tant que le certificat n'a pas été émis — nginx refuserait de
# démarrer. On sert donc d'abord ce vhost minimal, le temps que certbot
# valide le challenge ACME par webroot, puis on bascule sur miara.conf.
#
# `__DOMAIN__` est remplacé par scripts/setup_vps.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Racine du challenge HTTP-01 (créée par setup_vps.sh, lisible par nginx).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # default_type et non add_header : add_header ajouterait un second
        # en-tête Content-Type au lieu de remplacer celui par défaut.
        default_type text/plain;
        return 200 "miara: en attente du certificat TLS\n";
    }
}
