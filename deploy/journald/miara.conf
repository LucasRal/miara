# Rétention des journaux systemd (API, workers, front).
# Installé dans /etc/systemd/journald.conf.d/miara.conf par setup_vps.sh.
[Journal]
# Persistant : sans cela, un redémarrage du VPS efface les journaux et on perd
# la trace de l'incident qui a justement provoqué le redémarrage.
Storage=persistent
# Bornes explicites : un worker bavard ne doit pas remplir le disque du VPS.
SystemMaxUse=1G
SystemMaxFileSize=100M
MaxRetentionSec=30day
# On ne stocke pas le niveau debug : les workers Celery en produisent
# énormément et il noierait les lignes utiles.
MaxLevelStore=info
RateLimitIntervalSec=30s
RateLimitBurst=10000
